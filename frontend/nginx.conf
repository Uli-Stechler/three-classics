server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # The API lives in the backend container; the browser only ever talks to nginx.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes such as /checkers fall back to the app shell. The shell must be revalidated on
    # every visit (a cheap 304 when unchanged): without this, browsers guess a freshness lifetime from
    # Last-Modified and keep opening the previous build until a manual reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
